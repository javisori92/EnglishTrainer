<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Trainer</title>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F2F2F7;
  --bg-elevated:#FFFFFF;
  --bg-secondary:#E5E5EA;
  --card:#FFFFFF;
  --text:#1C1C1E;
  --text-secondary:#6E6E73;
  --text-tertiary:#AEAEB2;
  --separator:#D1D1D6;
  --accent:#007AFF;
  --accent-soft:#E8F1FF;
  --success:#34C759;
  --success-soft:#E6F9EA;
  --danger:#FF3B30;
  --danger-soft:#FFEBEA;
  --warning:#FF9500;
  --warning-soft:#FFF3E0;
  --purple:#AF52DE;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:20px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --tabbar-h: 56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;
    --bg-elevated:#1C1C1E;
    --bg-secondary:#1C1C1E;
    --card:#1C1C1E;
    --text:#FFFFFF;
    --text-secondary:#98989D;
    --text-tertiary:#636366;
    --separator:#38383A;
    --accent:#0A84FF;
    --accent-soft:#0A2A4D;
    --success:#30D158;
    --success-soft:#0E2A16;
    --danger:#FF453A;
    --danger-soft:#3A1210;
    --warning:#FF9F0A;
    --warning-soft:#3A2A0A;
    --purple:#BF5AF2;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#000000;
  --bg-elevated:#1C1C1E;
  --bg-secondary:#1C1C1E;
  --card:#1C1C1E;
  --text:#FFFFFF;
  --text-secondary:#98989D;
  --text-tertiary:#636366;
  --separator:#38383A;
  --accent:#0A84FF;
  --accent-soft:#0A2A4D;
  --success:#30D158;
  --success-soft:#0E2A16;
  --danger:#FF453A;
  --danger-soft:#3A1210;
  --warning:#FF9F0A;
  --warning-soft:#3A2A0A;
  --purple:#BF5AF2;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-padding-top: var(--safe-t); -webkit-text-size-adjust:100%;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  min-height:100dvh; overflow-x:hidden;
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  -webkit-font-smoothing:antialiased;
}
button, input, textarea, select{font-family:inherit; color:inherit;}
button{cursor:pointer;}
h1,h2,h3,p,ul{margin:0;}
a{color:var(--accent); text-decoration:none;}
::-webkit-scrollbar{width:0;height:0;}

/* Typography */
.large-title{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.15;}
.title1{font-size:26px; font-weight:800; letter-spacing:-.01em;}
.title2{font-size:21px; font-weight:700;}
.title3{font-size:18px; font-weight:700;}
.headline{font-size:16px; font-weight:600;}
.body-text{font-size:16px; font-weight:400; line-height:1.5;}
.subhead{font-size:14px; font-weight:500; color:var(--text-secondary);}
.footnote{font-size:13px; color:var(--text-secondary);}
.caption{font-size:11px; color:var(--text-tertiary); font-weight:600; letter-spacing:.01em;}

/* Layout shell */
#app-root{min-height:100dvh; display:flex; flex-direction:column;}
.layout{display:flex; flex:1; min-height:0;}
#sidebar{display:none;}
#main-col{flex:1; min-width:0; display:flex; flex-direction:column;}

.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  border-bottom:1px solid transparent;
}
.topbar.scrolled{border-bottom:1px solid var(--separator);}
.topbar-title{display:flex; flex-direction:column; gap:2px;}
.topbar-actions{display:flex; gap:8px; align-items:center;}

#content{flex:1; padding:8px 16px calc(var(--tabbar-h) + 28px); max-width:760px; width:100%; margin:0 auto; box-sizing:border-box;}
@media (min-width: 900px){
  #content{padding-bottom:32px;}
}

/* Tab bar (mobile) */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; padding-bottom:var(--safe-b);
  background:var(--bg-elevated);
  background:color-mix(in srgb, var(--bg-elevated) 90%, transparent);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--separator);
  transition:transform .22s ease;
}
.tabbar.hidden{transform:translateY(100%);}
.tab-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; padding:7px 2px 6px; background:none; border:none; color:var(--text-tertiary);
}
.tab-item svg{width:24px;height:24px;}
.tab-item span{font-size:10px; font-weight:600;}
.tab-item.active{color:var(--accent);}

/* Sidebar (desktop) */
@media (min-width: 900px){
  .tabbar{display:none;}
  #content{padding-bottom:32px;}
  #sidebar{
    display:flex; flex-direction:column; width:250px; flex-shrink:0;
    background:var(--bg-elevated); border-right:1px solid var(--separator);
    padding:20px 12px; gap:2px; position:sticky; top:0; height:100dvh;
  }
  .side-brand{padding:8px 10px 18px; display:flex; align-items:center; gap:10px;}
  .side-item{
    display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px;
    background:none; border:none; text-align:left; color:var(--text); font-size:15px; font-weight:500;
  }
  .side-item svg{width:20px;height:20px; color:var(--text-secondary); flex-shrink:0;}
  .side-item.active{background:var(--accent-soft); color:var(--accent); font-weight:700;}
  .side-item.active svg{color:var(--accent);}
}

/* Cards & lists */
.card{background:var(--card); border-radius:var(--radius-m); box-shadow:var(--shadow); padding:16px; margin-bottom:12px;}
.section-label{font-size:13px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.03em; margin:18px 4px 8px;}
.section-label:first-child{margin-top:4px;}
.list{background:var(--card); border-radius:var(--radius-m); overflow:hidden; box-shadow:var(--shadow); margin-bottom:12px;}
.list-row{
  display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--separator);
  background:none; width:100%; text-align:left; border-left:none; border-right:none; border-top:none;
}
.list-row:last-child{border-bottom:none;}
.list-row .lr-main{flex:1; min-width:0;}
.list-row .lr-title{font-size:16px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-row .lr-sub{font-size:13px; color:var(--text-secondary); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-row .lr-icons{display:flex; gap:6px; align-items:center; flex-shrink:0;}
.chev{color:var(--text-tertiary); flex-shrink:0;}
.icon-btn{
  width:32px; height:32px; border-radius:9px; border:none; background:var(--bg-secondary);
  display:flex; align-items:center; justify-content:center; color:var(--text-secondary); flex-shrink:0;
}
.icon-btn svg{width:17px; height:17px;}
.icon-btn.danger{color:var(--danger);}

/* Buttons */
.btn{
  border:none; border-radius:12px; padding:13px 18px; font-size:16px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
}
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:active{opacity:.8;}
.btn-secondary{background:var(--accent-soft); color:var(--accent);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-plain{background:none; color:var(--accent); font-weight:600; padding:10px;}
.text-action-btn{
  display:inline-flex; align-items:center; gap:4px; background:none; border:none;
  color:var(--accent); font-size:14px; font-weight:600; padding:6px 9px; border-radius:8px; white-space:nowrap;
}
.text-action-btn:active{background:var(--bg-secondary);}
.text-action-btn svg{width:15px; height:15px; flex-shrink:0;}
.text-action-btn.danger{color:var(--danger);}
.back-btn{
  display:inline-flex; align-items:center; gap:0px;
  background:none; border:none; color:var(--accent); font-size:17px; font-weight:400;
  padding:6px 10px 6px 2px; margin:2px 0 6px -8px; border-radius:8px;
}
.back-btn:active{background:var(--bg-secondary);}
.back-btn svg{width:26px; height:26px; flex-shrink:0; margin-right:-2px;}
.btn-block-row{display:flex; gap:10px;}
.btn:disabled{opacity:.4;}
.fab{
  position:fixed; right:calc(18px); bottom:calc(var(--tabbar-h) + var(--safe-b) + 18px); z-index:25;
  width:56px; height:56px; border-radius:28px; background:var(--accent); color:#fff; border:none;
  box-shadow:0 6px 18px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center;
  transition:transform .18s ease;
}
.fab svg{width:26px;height:26px;}
.fab:active{transform:scale(.92);}
@media (min-width:900px){ .fab{bottom:24px;} }

/* Forms */
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:700; color:var(--text-secondary); margin-bottom:6px;}
.input, .textarea, .select{
  width:100%; background:var(--bg-secondary); border:1px solid transparent; border-radius:10px;
  padding:12px 12px; font-size:16px; color:var(--text); outline:none;
}
.input:focus, .textarea:focus, .select:focus{border-color:var(--accent);}
.textarea{min-height:90px; resize:vertical; line-height:1.4; font-family:inherit;}
.hint-text{font-size:12px; color:var(--text-tertiary); margin-top:5px;}
.option-edit-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.option-edit-row input[type="text"]{flex:1;}
.option-edit-row input[type="radio"]{width:20px;height:20px; accent-color:var(--success); flex-shrink:0;}

/* Segmented control */
.segmented{display:flex; background:var(--bg-secondary); border-radius:10px; padding:3px; gap:2px;}
.segmented button{flex:1; border:none; background:none; padding:8px 6px; border-radius:8px; font-size:13px; font-weight:600; color:var(--text-secondary);}
.segmented button.active{background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.15);}

/* Chips */
.chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chip{
  padding:8px 14px; border-radius:20px; background:var(--bg-secondary); border:none;
  font-size:13px; font-weight:600; color:var(--text-secondary);
}
.chip.active{background:var(--accent); color:#fff;}

/* Badges */
.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:700;}
.badge-green{background:var(--success-soft); color:var(--success);}
.badge-red{background:var(--danger-soft); color:var(--danger);}
.badge-orange{background:var(--warning-soft); color:var(--warning);}
.badge-gray{background:var(--bg-secondary); color:var(--text-secondary);}

/* Home stat grid */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.stat-card{background:var(--card); border-radius:var(--radius-m); padding:14px; box-shadow:var(--shadow);}
.stat-num{font-size:26px; font-weight:800; letter-spacing:-.02em;}
.stat-label{font-size:12px; color:var(--text-secondary); font-weight:600; margin-top:2px;}

.streak-card{
  background:linear-gradient(135deg, #FF9500, #FF3B30); border-radius:var(--radius-m);
  padding:18px; color:#fff; margin-bottom:14px; box-shadow:var(--shadow);
}
.streak-top{display:flex; align-items:center; gap:12px;}
.streak-flame{font-size:34px; line-height:1;}
.streak-num{font-size:30px; font-weight:800;}
.streak-sub{font-size:13px; opacity:.9; font-weight:600;}
.streak-dots{display:flex; gap:6px; margin-top:14px;}
.streak-dot{width:100%; height:7px; border-radius:4px; background:rgba(255,255,255,.3);}
.streak-dot.on{background:#fff;}

.topic-bar-row{margin-bottom:10px;}
.topic-bar-track{height:8px; border-radius:4px; background:var(--bg-secondary); overflow:hidden; margin-top:6px;}
.topic-bar-fill{height:100%; border-radius:4px;}

/* Empty state */
.empty-state{text-align:center; padding:48px 20px; color:var(--text-secondary);}
.empty-state .es-icon{font-size:44px; margin-bottom:10px;}
.empty-state h3{color:var(--text); margin-bottom:6px;}
.empty-state p{font-size:14px; line-height:1.5; max-width:280px; margin:0 auto 18px;}

/* Exercise runner */
.exercise-wrap{padding-bottom:110px;}
.progress-track{height:6px; background:var(--bg-secondary); border-radius:4px; overflow:hidden; margin-bottom:14px;}
.progress-fill{height:100%; background:var(--accent); border-radius:4px; transition:width .25s ease;}
.session-meta{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.exercise-card{background:var(--card); border-radius:var(--radius-l); padding:20px; box-shadow:var(--shadow); margin-bottom:16px;}
.ex-topic-tag{font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.03em;}
.ex-card-header{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px;}
.help-btn{
  flex-shrink:0; width:30px; height:30px; border-radius:15px; background:var(--bg-secondary);
  display:flex; align-items:center; justify-content:center; color:var(--accent); border:none; margin-top:-4px;
}
.help-btn svg{width:18px; height:18px;}
.help-btn:active{background:var(--accent-soft);}
.ex-question{font-size:20px; font-weight:700; line-height:1.35; margin-bottom:4px;}
.option-row{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--bg-secondary); border:2px solid transparent; border-radius:12px;
  padding:13px 14px; margin-top:10px; font-size:16px; font-weight:500;
}
.option-row .opt-letter{
  width:26px; height:26px; border-radius:14px; background:var(--card); display:flex; align-items:center;
  justify-content:center; font-size:13px; font-weight:700; color:var(--text-secondary); flex-shrink:0;
}
.option-row.correct{border-color:var(--success); background:var(--success-soft);}
.option-row.incorrect{border-color:var(--danger); background:var(--danger-soft);}
.option-row.selected:not(.correct):not(.incorrect){border-color:var(--accent);}
.tf-row{display:flex; gap:10px; margin-top:14px;}
.tf-btn{flex:1; padding:18px; border-radius:12px; background:var(--bg-secondary); border:2px solid transparent; font-size:16px; font-weight:700;}
.tf-btn.correct{border-color:var(--success); background:var(--success-soft); color:var(--success);}
.tf-btn.incorrect{border-color:var(--danger); background:var(--danger-soft); color:var(--danger);}

.feedback-box{border-radius:12px; padding:14px; margin-top:14px; display:flex; gap:10px; align-items:flex-start;}
.feedback-box.ok{background:var(--success-soft); color:var(--success);}
.feedback-box.bad{background:var(--danger-soft); color:var(--danger);}
.feedback-box .fb-text{color:var(--text); font-size:14px; line-height:1.5;}
.feedback-box .fb-title{font-weight:700; margin-bottom:3px;}

.sticky-actions{
  position:fixed; left:0; right:0; bottom:calc(var(--tabbar-h) + var(--safe-b)); z-index:22;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--separator);
  transition:transform .18s ease, bottom .18s ease;
}
@media (min-width:900px){ .sticky-actions{bottom:0;} }
body.keyboard-open .sticky-actions{ bottom:0; }
body.keyboard-open .tabbar{ display:none; }

/* Modal / sheet */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
@media (min-width:640px){ .overlay{align-items:center;} }
.sheet{
  background:var(--bg); width:100%; max-width:560px; max-height:92dvh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:14px 18px calc(24px + var(--safe-b));
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
}
@media (min-width:640px){ .sheet{border-radius:20px; max-height:88dvh; margin-bottom:5vh;} }
.sheet-handle{width:36px; height:5px; background:var(--separator); border-radius:3px; margin:4px auto 14px;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}

/* Toast */
#toast-host{position:fixed; top:calc(var(--safe-t) + 10px); left:0; right:0; z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
.toast{
  background:var(--card); box-shadow:var(--shadow); border-radius:14px; padding:12px 16px; display:flex; gap:10px; align-items:center;
  max-width:340px; animation:toast-in .25s ease; border:1px solid var(--separator);
}
.toast .t-icon{font-size:22px;}
.toast .t-title{font-weight:700; font-size:14px;}
.toast .t-sub{font-size:12px; color:var(--text-secondary);}
@keyframes toast-in{from{transform:translateY(-14px); opacity:0;} to{transform:translateY(0); opacity:1;}}

/* Achievements */
.ach-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(88px,1fr)); gap:10px;}
.ach-item{background:var(--card); border-radius:14px; padding:12px 8px; text-align:center; box-shadow:var(--shadow);}
.ach-item.locked{opacity:.4;}
.ach-icon{font-size:26px; margin-bottom:6px;}
.ach-name{font-size:11px; font-weight:700; line-height:1.3;}

/* Vocab */
.vocab-row{padding:16px; border-bottom:1px solid var(--separator);}
.vocab-row:last-child{border-bottom:none;}
.vocab-header-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.vocab-term{font-size:17px; font-weight:700; line-height:1.3;}
.vocab-term-tr{font-weight:500; color:var(--text-secondary);}
.vocab-translate-btn{
  flex-shrink:0; font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-soft);
  border:none; padding:7px 12px; border-radius:20px; white-space:nowrap; margin-top:1px;
}
.vocab-phonetic{font-size:13px; color:var(--text-secondary); margin-top:4px; font-style:italic;}
.vocab-def{font-size:14px; color:var(--text); margin-top:9px; line-height:1.45;}
.vocab-example{font-size:13px; color:var(--text-secondary); margin-top:7px; font-style:italic;}
.category-chip-picker{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}

/* Result circle */
.result-circle-wrap{display:flex; justify-content:center; margin:10px 0 18px;}
.result-topic-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-size:14px;}

.center-col{display:flex; flex-direction:column; align-items:center; text-align:center;}
.switch{position:relative; width:48px; height:28px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch-track{position:absolute; inset:0; background:var(--bg-secondary); border-radius:16px; transition:.2s;}
.switch-track:before{content:""; position:absolute; width:24px; height:24px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .switch-track{background:var(--success);}
.switch input:checked + .switch-track:before{transform:translateX(20px);}
.row-between{display:flex; align-items:center; justify-content:space-between;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
</style>
</head>
<body>
<div id="app-root">
  <div class="layout">
    <nav id="sidebar"></nav>
    <div id="main-col">
      <div class="topbar" id="topbar">
        <div class="topbar-title">
          <div class="large-title" id="topbar-title-text">Inicio</div>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </div>
      <div id="content"></div>
    </div>
  </div>
  <div class="tabbar" id="tabbar"></div>
</div>
<div id="modal-host"></div>
<div id="toast-host"></div>

<script>
(function(){
"use strict";

/* ======================= ICONS ======================= */

/* ======================= DATA LAYER ======================= */
const STORAGE_KEY = 'engtrainer_data_v1';
const LEITNER_DAYS = [0,1,2,4,7,14];

function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function todayStr(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

function defaultData(){
  return {
    meta:{version:1, createdAt:Date.now()},
    topics: [],
    exercises: [],
    vocabulary: [],
    achievements: [

      {id:'def_correct20', name:'Racha perfecta', description:'Acierta 20 preguntas seguidas', icon:'🎯', type:'correct_streak', target:20, custom:false},
      {id:'def_correct50', name:'Imparable', description:'Acierta 50 preguntas seguidas', icon:'⚡', type:'correct_streak', target:50, custom:false},
      {id:'def_total100', name:'Cien aciertos', description:'100 respuestas correctas en total', icon:'💯', type:'total_correct', target:100, custom:false},
      {id:'def_total500', name:'Quinientos aciertos', description:'500 respuestas correctas en total', icon:'🏆', type:'total_correct', target:500, custom:false},

    ],
    examHistory: [],
    progress: {},
    streak: {current:0, longest:0, lastActiveDate:null, activeDates:[]},
    totalStats: {totalAnswered:0, totalCorrect:0, correctStreak:0, bestCorrectStreak:0},
    settings: {theme:'auto', examQuestionCount:10, dailyGoal:15, soundEnabled:true},
    unlockedAchievementIds: []
  };
}

let DATA = loadData();
function normalizeData(parsed){
  const d = defaultData();
  if(!parsed || typeof parsed!=='object') return d;
  return Object.assign(d, parsed, {
    topics: Array.isArray(parsed.topics) ? parsed.topics : [],
    exercises: Array.isArray(parsed.exercises) ? parsed.exercises : [],
    vocabulary: Array.isArray(parsed.vocabulary) ? parsed.vocabulary : [],
    achievements: Array.isArray(parsed.achievements) ? parsed.achievements : d.achievements,
    examHistory: Array.isArray(parsed.examHistory) ? parsed.examHistory : [],
    progress: (parsed.progress && typeof parsed.progress==='object') ? parsed.progress : {},
    streak: Object.assign(d.streak, parsed.streak||{}),
    totalStats: Object.assign(d.totalStats, parsed.totalStats||{}),
    settings: Object.assign(d.settings, parsed.settings||{}),
    unlockedAchievementIds: Array.isArray(parsed.unlockedAchievementIds) ? parsed.unlockedAchievementIds : []
  });
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    return normalizeData(JSON.parse(raw));
  }catch(e){ return defaultData(); }
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
  }, 120);
}

/* ======================= HELPERS ======================= */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mdLite(text){
  if(!text) return '';
  let esc = escapeHtml(text);
  esc = esc.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  const lines = esc.split('\n'); let html=''; let inList=false;
  for(const line of lines){
    if(/^\s*-\s+/.test(line)){
      if(!inList){ html+='<ul style="margin:6px 0 6px 18px; padding:0;">'; inList=true; }
      html += '<li style="margin-bottom:4px;">'+line.replace(/^\s*-\s+/,'')+'</li>';
    } else {
      if(inList){ html+='</ul>'; inList=false; }
      html += line.trim()==='' ? '<div style="height:8px;"></div>' : '<p style="margin:0 0 8px;">'+line+'</p>';
    }
  }
  if(inList) html+='</ul>';
  return html;
}
function topicById(id){ return DATA.topics.find(t=>t.id===id); }
function exById(id){ return DATA.exercises.find(e=>e.id===id); }
function vocabCategories(){
  return Array.from(new Set(DATA.vocabulary.map(v=>v.category).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'es'));
}
function getProgress(exId){
  return DATA.progress[exId] || {attempts:0, correct:0, incorrect:0, box:0, lastSeen:null};
}
function topicAccuracy(topicId){
  const exs = DATA.exercises.filter(e=>e.topicId===topicId);
  let correct=0, attempts=0;
  exs.forEach(e=>{ const p=getProgress(e.id); correct+=p.correct; attempts+=p.attempts; });
  return {attempts, correct, pct: attempts>0 ? Math.round(correct/attempts*100) : null};
}
function overallAccuracy(){
  const t = DATA.totalStats;
  return t.totalAnswered>0 ? Math.round(t.totalCorrect/t.totalAnswered*100) : 0;
}
function accColor(pct){
  if(pct===null) return 'var(--text-tertiary)';
  if(pct>=80) return 'var(--success)';
  if(pct>=50) return 'var(--warning)';
  return 'var(--danger)';
}
function accBadgeClass(pct){
  if(pct===null) return 'badge-gray';
  if(pct>=80) return 'badge-green';
  if(pct>=50) return 'badge-orange';
  return 'badge-red';
}
function typeLabel(t){
  return {multiple_choice:'Opción múltiple', fill_blank:'Rellenar hueco', true_false:'Verdadero / Falso', translation:'Traducción'}[t] || t;
}

/* ======================= STREAK ======================= */
function registerActivity(){
  const today = todayStr();
  const s = DATA.streak;
  if(s.lastActiveDate === today) return;
  if(s.lastActiveDate){
    const diff = daysBetween(s.lastActiveDate, today);
    if(diff === 1) s.current += 1;
    else if(diff > 1) s.current = 1;
  } else {
    s.current = 1;
  }
  s.lastActiveDate = today;
  s.longest = Math.max(s.longest, s.current);
  s.activeDates.push(today);
  if(s.activeDates.length > 120) s.activeDates = s.activeDates.slice(-120);
  save();
}
function last7Days(){
  const arr=[];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    arr.push(todayStr(d));
  }
  return arr;
}

/* ======================= ACHIEVEMENTS ======================= */
function achievementProgressValue(a){
  switch(a.type){
    case 'streak_days': return DATA.streak.longest;
    case 'correct_streak': return DATA.totalStats.bestCorrectStreak;
    case 'total_correct': return DATA.totalStats.totalCorrect;
    case 'exam_count': return DATA.examHistory.length;
    case 'exam_score': return DATA.examHistory.reduce((m,e)=>Math.max(m,e.percentage),0);
    case 'topic_mastery': {
      const acc = topicAccuracy(a.topicId);
      return (acc.attempts>=10) ? acc.pct : 0;
    }
    default: return 0;
  }
}
function checkAchievements(){
  const newlyUnlocked = [];
  DATA.achievements.forEach(a=>{
    if(DATA.unlockedAchievementIds.includes(a.id)) return;
    const val = achievementProgressValue(a);
    if(val >= a.target){
      DATA.unlockedAchievementIds.push(a.id);
      newlyUnlocked.push(a);
    }
  });
  if(newlyUnlocked.length){
    save();
    newlyUnlocked.forEach((a,i)=> setTimeout(()=> showAchievementToast(a), i*900));
  }
}
function showAchievementToast(a){
  showToast(a.icon||'🏆', 'Logro desbloqueado', a.name);
  beep(880,120); setTimeout(()=>beep(1180,160),110);
}

/* ======================= SOUND ======================= */
let audioCtx=null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function beep(freq, duration){
  if(!DATA.settings.soundEnabled) return;
  try{
    const ctx = getAudioCtx(); if(!ctx) return;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = freq; osc.type='sine';
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration/1000);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + duration/1000);
  }catch(e){}
}

/* ======================= ADAPTIVE SELECTION ======================= */
function exerciseWeight(ex){
  const p = getProgress(ex.id);
  let weight = 10;
  if(p.attempts === 0){ weight += 55; }
  else {
    const accuracy = p.correct / p.attempts;
    weight += (1-accuracy) * 80;
    const dueDays = LEITNER_DAYS[p.box||0];
    const daysSince = p.lastSeen ? (Date.now()-p.lastSeen)/86400000 : 999;
    if(daysSince >= dueDays) weight += 25; else weight *= 0.25;
  }
  const t = topicAccuracy(ex.topicId);
  if(t.attempts >= 4 && t.pct !== null && t.pct < 60) weight *= 1.4;
  return Math.max(weight, 1);
}
function pickAdaptiveExercise(pool, excludeId){
  let candidates = pool.filter(e=>e.id !== excludeId);
  if(candidates.length === 0) candidates = pool;
  if(candidates.length === 0) return null;
  const weights = candidates.map(exerciseWeight);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<candidates.length;i++){
    r -= weights[i];
    if(r<=0) return candidates[i];
  }
  return candidates[candidates.length-1];
}
function recordAnswer(ex, isCorrect){
  const p = DATA.progress[ex.id] || {attempts:0, correct:0, incorrect:0, box:0, lastSeen:null};
  p.attempts++;
  if(isCorrect){ p.correct++; p.box = Math.min(5, (p.box||0)+1); }
  else { p.incorrect++; p.box = 0; }
  p.lastSeen = Date.now();
  DATA.progress[ex.id] = p;

  DATA.totalStats.totalAnswered++;
  if(isCorrect){
    DATA.totalStats.totalCorrect++;
    DATA.totalStats.correctStreak++;
    DATA.totalStats.bestCorrectStreak = Math.max(DATA.totalStats.bestCorrectStreak, DATA.totalStats.correctStreak);
  } else {
    DATA.totalStats.correctStreak = 0;
  }
  registerActivity();
  save();
  checkAchievements();
}

/* ======================= ANSWER CHECKING ======================= */
function normalizeStr(s){
  return String(s||'')
    .trim()
    .toLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/\s+/g, ' ')
    .replace(/[.!?,;:]+$/g, '')
    .trim();
}
function checkAnswer(ex, userInput){
  if(ex.type==='multiple_choice'){
    return Number(userInput) === Number(ex.correctIndex);
  }
  if(ex.type==='true_false'){
    return Boolean(userInput) === Boolean(ex.correctBool);
  }
  if(ex.type==='fill_blank' || ex.type==='translation'){
    const accepted = (ex.acceptedAnswers||[]).map(normalizeStr);
    return accepted.includes(normalizeStr(userInput));
  }
  return false;
}

function render(){
  applyTheme();
  document.getElementById('topbar-title-text').textContent = screenTitle();
  renderTopbarActions();
  renderTabbar();
  renderSidebar();
  const c = document.getElementById('content');
  let html = '';
  switch(state.screen){
    case 'home': html = renderHome(); break;
    case 'study': html = state.studyTopicId ? renderStudyTopic() : renderStudyList(); break;
    case 'practice': html = renderPractice(); break;
    case 'exam': html = renderExam(); break;
    case 'vocab': html = renderVocab(); break;
    case 'content': html = renderContent(); break;
    case 'settings': html = renderSettings(); break;
    default: html = renderHome();
  }
  c.innerHTML = html;
  afterRender();
}

  if(h<12) return 'Buenos días';
  if(h<20) return 'Buenas tardes';
  return 'Buenas noches';
}

let examConfig = {count:10, topics:['all']};

function buildExamQuestions(cfg){
  let pool = DATA.exercises.slice();
  if(!(cfg.topics.length===1 && cfg.topics[0]==='all')){
    pool = pool.filter(e=>cfg.topics.includes(e.topicId));
  }
  // shuffle
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  // weight toward weaker topics slightly using adaptive weight as sort bias but keep coverage: sort by weight desc, then take top N shuffled again
  pool.sort((a,b)=> exerciseWeight(b)-exerciseWeight(a));
  const n = cfg.count==='all' ? pool.length : Math.min(cfg.count, pool.length);
  const top = pool.slice(0, Math.max(n, Math.min(pool.length, n*2)));
  for(let i=top.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [top[i],top[j]]=[top[j],top[i]]; }
  return top.slice(0,n);
}

function renderExamResult(){
  const r = state.examResult;
  const pct = r.percentage;
  const color = accColor(pct);
  let html = '<div class="center-col" style="padding:12px 0 6px;">';
  html += '<div class="result-circle-wrap"><svg width="140" height="140" viewBox="0 0 140 140"><circle cx="70" cy="70" r="60" fill="none" stroke="var(--bg-secondary)" stroke-width="12"/><circle cx="70" cy="70" r="60" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(2*Math.PI*60)+'" stroke-dashoffset="'+(2*Math.PI*60*(1-pct/100))+'" transform="rotate(-90 70 70)"/><text x="70" y="76" text-anchor="middle" font-size="28" font-weight="800" fill="'+color+'" font-family="inherit">'+pct+'%</text></svg></div>';
  html += '<div class="title2">'+r.correctCount+' de '+r.total+' correctas</div>';
  html += '<div class="footnote">'+(pct>=90?'¡Sobresaliente! Dominas este contenido.':pct>=70?'¡Buen trabajo! Vas por buen camino.':pct>=50?'Vas mejorando, sigue practicando.':'Toca reforzar estos temas con más práctica.')+'</div></div>';

  html += '<div class="section-label">Resultado por tema</div><div class="card">';
  Object.keys(r.byTopic).forEach(tid=>{
    const bt = r.byTopic[tid];
    const p = Math.round(bt.correct/bt.total*100);
    const t = topicById(tid);
    html += '<div class="topic-bar-row"><div class="result-topic-row"><span style="font-weight:600;">'+escapeHtml(t?t.name:'Tema')+'</span><span style="color:'+accColor(p)+'; font-weight:700;">'+bt.correct+'/'+bt.total+' · '+p+'%</span></div><div class="topic-bar-track"><div class="topic-bar-fill" style="width:'+p+'%; background:'+accColor(p)+';"></div></div></div>';
  });
  html += '</div>';

  const missed = r.details.filter(d=>!d.isCorrect);
  if(missed.length){
    html += '<div class="section-label">Preguntas falladas ('+missed.length+')</div>';
    html += missed.map(d=>{
      const ex = d.ex;
      let correctText = '';
      if(ex.type==='multiple_choice') correctText = ex.options[ex.correctIndex];
      else if(ex.type==='true_false') correctText = ex.correctBool ? 'Verdadero' : 'Falso';
      else correctText = (ex.acceptedAnswers||[])[0] || '';
      return '<div class="card"><div class="footnote" style="margin-bottom:4px;">'+escapeHtml(topicById(ex.topicId)?topicById(ex.topicId).name:'')+'</div><div class="body-text" style="font-weight:600; margin-bottom:6px;">'+escapeHtml(ex.prompt)+'</div><div class="footnote">Tu respuesta: <span style="color:var(--danger); font-weight:600;">'+escapeHtml(String(d.userAnswerLabel))+'</span></div><div class="footnote">Correcta: <span style="color:var(--success); font-weight:600;">'+escapeHtml(String(correctText))+'</span></div>'+(ex.explanation?'<div class="footnote" style="margin-top:6px;">'+escapeHtml(ex.explanation)+'</div>':'')+'</div>';
    }).join('');
  }

  html += '<div style="height:8px;"></div><button class="btn btn-primary" data-action="exam-done">Guardar y volver a Inicio</button>';
  if(missed.length){
    html += '<button class="btn btn-secondary" style="margin-top:10px;" data-action="retry-missed">'+icon('dumbbell',18)+' Reforzar preguntas falladas</button>';
  }
  return html;
}

/* ======================= EXERCISE RUNNER (shared: practice + exam) ======================= */
function currentRunnerCtx(){
  return state.screen==='exam' ? state.exam : state.practice;
}
function renderExerciseRunner(mode){
  const ctx = mode==='exam' ? state.exam : state.practice;
  const ex = mode==='exam' ? ctx.questions[ctx.index] : ctx.current;
  if(!ex){
    return '<div class="empty-state"><div class="es-icon">🎉</div><h3 class="title3">Nada más por aquí</h3><p>Añade más ejercicios para seguir practicando este tema.</p></div>';
  }
  const t = topicById(ex.topicId);
  const answered = mode==='exam' ? (ctx.answers[ex.id] !== undefined) : ctx.answeredState;
  let html = '<div class="exercise-wrap">';

  if(mode==='exam'){
    const pct = Math.round(((ctx.index)/ctx.questions.length)*100);
    html += '<div class="session-meta"><span class="footnote">Pregunta '+(ctx.index+1)+' de '+ctx.questions.length+'</span><button class="text-action-btn danger" data-action="exam-finish-early">'+icon('close',15)+' Terminar</button></div>';
    html += '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;"></div></div>';
  } else {
    html += '<div class="session-meta"><span class="footnote">Sesión: '+ctx.sessionCorrect+'/'+ctx.sessionTotal+' correctas</span><button class="text-action-btn danger" data-action="practice-stop">'+icon('close',15)+' Terminar</button></div>';
  }

  html += '<div class="exercise-card">';
  html += '<div class="ex-card-header"><div class="ex-topic-tag">'+escapeHtml(t?t.name:'')+' · '+typeLabel(ex.type)+'</div>'+
    (mode==='practice' && ex.hint && !answered ? '<button type="button" class="help-btn" data-action="show-hint">'+icon('help',18)+'</button>' : '')+
    '</div>';
  html += '<div class="ex-question">'+escapeHtml(ex.prompt)+'</div>';

  if(ex.type==='multiple_choice'){
    html += (ex.options||[]).map((opt,i)=>{
      let cls='option-row';
      if(mode==='practice' && answered){
        if(i===ex.correctIndex) cls+=' correct';
        else if(i===ctx.selected) cls+=' incorrect';
      } else if(mode==='exam' && ctx.answers[ex.id]!==undefined && ctx.answers[ex.id]===i){
        cls+=' selected';
      }
      return '<button class="'+cls+'" data-opt="'+i+'" '+((mode==='practice'&&answered)?'disabled':'')+'><span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span>'+escapeHtml(opt)+'</span></button>';
    }).join('');
  } else if(ex.type==='true_false'){
    let tCls='tf-btn', fCls='tf-btn';
    if(mode==='practice' && answered){
      if(ex.correctBool) tCls+=' correct'; else fCls+=' correct';
      if(ctx.selected===true && !ex.correctBool) tCls+=' incorrect';
      if(ctx.selected===false && ex.correctBool) fCls+=' incorrect';
    }
    html += '<div class="tf-row"><button class="'+tCls+'" data-tf="true" '+((mode==='practice'&&answered)?'disabled':'')+'>Verdadero</button><button class="'+fCls+'" data-tf="false" '+((mode==='practice'&&answered)?'disabled':'')+'>Falso</button></div>';
  } else {
    const val = mode==='exam' ? (ctx.answers[ex.id]||'') : (ctx.textValue||'');
    html += '<input type="text" class="input" id="free-answer-input" placeholder="Escribe tu respuesta" value="'+escapeHtml(val)+'" '+((mode==='practice'&&answered)?'disabled':'')+' style="margin-top:12px;" autocomplete="off" autocorrect="off" spellcheck="false">';
  }

  if(mode==='practice' && answered){
    const isCorrect = ctx.lastCorrect;
    html += '<div class="feedback-box '+(isCorrect?'ok':'bad')+'">'+icon(isCorrect?'check':'close',20)+'<div class="fb-text"><div class="fb-title">'+(isCorrect?'¡Correcto!':'No es correcto')+'</div>'+(ex.explanation?escapeHtml(ex.explanation):'')+'</div></div>';
  }
  html += '</div></div>';

  // sticky action bar
  html += '<div class="sticky-actions">';
  if(mode==='practice'){
    if(!answered){
      const needsCheck = ex.type==='fill_blank' || ex.type==='translation';
      html += '<button class="btn btn-primary" data-action="practice-check" '+ (needsCheck? '': 'style="display:none"') +'>Comprobar</button>';
    } else {
      html += '<button class="btn btn-primary" data-action="practice-next">Siguiente</button>';
    }
  } else {
    const isLast = ctx.index === ctx.questions.length-1;
    html += '<div class="btn-block-row">';
    if(ctx.index>0) html += '<button class="btn btn-secondary" data-action="exam-prev" style="flex:0 0 90px;">Atrás</button>';
    html += '<button class="btn btn-primary" data-action="'+(isLast?'exam-submit':'exam-next')+'">'+(isLast?'Finalizar examen':'Siguiente')+'</button>';
    html += '</div>';
  }
  html += '</div>';

  return html;
}

/* ======================= VOCAB ======================= */
function renderVocab(){
  const categories = vocabCategories();
  let html = '<input type="text" class="input" id="vocab-search" placeholder="Buscar palabra..." value="'+escapeHtml(state.vocabSearch)+'" style="margin-bottom:10px;">';
  if(categories.length){
    html += '<div class="chip-row" id="vocab-category-chips"><button class="chip '+(state.vocabFilterCategory==='all'?'active':'')+'" data-vcategory="all">Todas</button>';
    html += categories.map(c=>'<button class="chip '+(state.vocabFilterCategory===c?'active':'')+'" data-vcategory="'+escapeHtml(c)+'">'+escapeHtml(c)+'</button>').join('');
    html += '</div>';
  }
  let list = DATA.vocabulary.slice();
  if(state.vocabFilterCategory!=='all') list = list.filter(v=>v.category===state.vocabFilterCategory);
  if(state.vocabSearch.trim()) list = list.filter(v=> v.term.toLowerCase().includes(state.vocabSearch.trim().toLowerCase()));

  if(list.length===0){
    html += '<div class="empty-state"><div class="es-icon">🗂️</div><h3 class="title3">Sin resultados</h3><p>No hay vocabulario que coincida. Puedes añadir palabras nuevas desde Gestionar Contenido.</p></div>';
  } else {
    html += '<div class="list">' + list.map(v=>{
      const showingTr = !!state.vocabTranslateShown[v.id];
      const descText = showingTr ? (v.descriptionEs || 'Sin traducción disponible') : (v.description||'');
      const btnLabel = showingTr ? 'Mostrar original' : 'Ver traducción';
      return '<div class="vocab-row">' +
        '<div class="vocab-header-row"><div class="vocab-term">'+escapeHtml(v.term)+(v.translationEs?' <span class="vocab-term-tr">('+escapeHtml(v.translationEs)+')</span>':'')+'</div>' +
        '<button class="vocab-translate-btn" data-toggle-desc="'+v.id+'">'+btnLabel+'</button></div>' +
        (v.phonetic?'<div class="vocab-phonetic">'+escapeHtml(v.phonetic)+'</div>':'') +
        '<div class="vocab-def">'+escapeHtml(descText)+'</div>' +
        (v.example?'<div class="vocab-example">"'+escapeHtml(v.example)+'"</div>':'') +
        '</div>';
    }).join('') + '</div>';
  }
  html += '<button class="fab" data-action="add-vocab">'+icon('plus',26)+'</button>';
  return html;
}

        html += '<div class="list">' + list.map(e=>{

          return '<div class="list-row"><div class="lr-main"><div class="lr-title">'+escapeHtml(e.prompt)+'</div><div class="lr-sub">'+escapeHtml(t?t.name:'')+' · '+typeLabel(e.type)+'</div></div><div class="lr-icons"><button class="icon-btn" data-edit-ex="'+e.id+'">'+icon('edit',16)+'</button><button class="icon-btn danger" data-del-ex="'+e.id+'">'+icon('trash',16)+'</button></div></div>';
        }).join('') + '</div>';
      }
      html += '<button class="fab" data-action="add-exercise">'+icon('plus',26)+'</button>';
    }
  }

  else if(state.contentTab==='vocab'){
    if(DATA.vocabulary.length===0){
      html += '<div class="empty-state"><div class="es-icon">🔤</div><h3 class="title3">Sin vocabulario</h3><p>Añade palabras con su categoría, definición y traducción.</p></div>';
    } else {
      html += '<div class="list">' + DATA.vocabulary.map(v=>{
        return '<div class="list-row"><div class="lr-main"><div class="lr-title">'+escapeHtml(v.term)+'</div><div class="lr-sub">'+escapeHtml(v.category||'Sin categoría')+'</div></div><div class="lr-icons"><button class="icon-btn" data-edit-voc="'+v.id+'">'+icon('edit',16)+'</button><button class="icon-btn danger" data-del-voc="'+v.id+'">'+icon('trash',16)+'</button></div></div>';
      }).join('') + '</div>';
    }
    html += '<button class="fab" data-action="add-vocab">'+icon('plus',26)+'</button>';
  }

  else if(state.contentTab==='achievements'){
    html += '<div class="list">' + DATA.achievements.map(a=>{
      const unlocked = DATA.unlockedAchievementIds.includes(a.id);
      return '<div class="list-row"><div class="lr-main" style="display:flex; align-items:center; gap:10px;"><span style="font-size:22px;">'+ (a.icon||'🏆') +'</span><div><div class="lr-title">'+escapeHtml(a.name)+'</div><div class="lr-sub">'+escapeHtml(a.description)+(unlocked?' · Conseguido':'')+'</div></div></div><div class="lr-icons"><button class="icon-btn" data-edit-ach="'+a.id+'">'+icon('edit',16)+'</button><button class="icon-btn danger" data-del-ach="'+a.id+'">'+icon('trash',16)+'</button></div></div>';
    }).join('') + '</div>';
    html += '<button class="fab" data-action="add-achievement">'+icon('plus',26)+'</button>';
  }

  return html;
}

/* ======================= MODALS ======================= */
function openModal(innerHtml){
  const host = document.getElementById('modal-host');
  host.innerHTML = '<div class="overlay" id="overlay"><div class="sheet">'+innerHtml+'</div></div>';
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
  document.querySelectorAll('[data-action="close-modal"]').forEach(b=>{ b.onclick=closeModal; });
  wireModalActions();
}
function closeModal(){
  document.getElementById('modal-host').innerHTML='';
  if(modalOnDismiss){ const cb=modalOnDismiss; modalOnDismiss=null; cb(); }
}
let modalOnDismiss = null;

function modalHeader(title){
  return '<div class="sheet-handle"></div><div class="sheet-header"><div class="title3">'+escapeHtml(title)+'</div><button class="icon-btn" data-action="close-modal">'+icon('close',16)+'</button></div>';
}

  let html = modalHeader(e?'Editar ejercicio':'Nuevo ejercicio');

    ['multiple_choice','fill_blank','true_false','translation'].map(tp=>'<option value="'+tp+'" '+(type===tp?'selected':'')+'>'+typeLabel(tp)+'</option>').join('') + '</select></div>';
  html += '<div class="field"><label>Enunciado</label><textarea class="textarea" id="m-ex-prompt" placeholder="Ej: She ___ to school every day. (go)">'+(e?escapeHtml(e.prompt):'')+'</textarea><div class="hint-text">Para rellenar hueco usa ___ donde va la respuesta.</div></div>';

  html += '<button class="btn btn-primary" data-action="save-exercise" data-id="'+(e?e.id:'')+'">Guardar</button>';
  openModal(html);
  document.getElementById('m-ex-type').addEventListener('change', (ev)=>{
    document.getElementById('m-ex-type-fields').innerHTML = renderExerciseTypeFields(ev.target.value, null);
    wireExerciseTypeFieldEvents();
  });
  wireExerciseTypeFieldEvents();
}
function renderExerciseTypeFields(type, e){
  if(type==='multiple_choice'){
    const opts = (e&&e.options)||['','',''];
    let html = '<div class="field"><label>Opciones (marca la correcta)</label><div id="mc-options">';
    html += opts.map((o,i)=>'<div class="option-edit-row"><input type="radio" name="mc-correct" value="'+i+'" '+(e&&e.correctIndex===i?'checked':(!e&&i===0?'checked':''))+'><input type="text" class="input" data-mc-opt value="'+escapeHtml(o)+'" placeholder="Opción '+(i+1)+'"><button type="button" class="icon-btn danger" data-remove-opt>'+icon('close',14)+'</button></div>').join('');
    html += '</div><button type="button" class="text-action-btn" style="margin-top:2px;" data-action="add-mc-opt">'+icon('plus',15)+' Añadir opción</button></div>';
    return html;
  }
  if(type==='fill_blank' || type==='translation'){
    const accepted = e && e.acceptedAnswers ? e.acceptedAnswers.join(', ') : '';
    return '<div class="field"><label>Respuesta(s) correcta(s)</label><input type="text" class="input" id="m-ex-accepted" value="'+escapeHtml(accepted)+'" placeholder="respuesta, alternativa2, alternativa3"><div class="hint-text">Separa varias respuestas válidas con comas.</div></div>';
  }
  if(type==='true_false'){
    const val = e ? e.correctBool : true;
    return '<div class="field"><label>Respuesta correcta</label><div class="segmented"><button type="button" class="'+(val?'active':'')+'" data-tfcorrect="true">Verdadero</button><button type="button" class="'+(!val?'active':'')+'" data-tfcorrect="false">Falso</button></div></div>';
  }
  return '';
}
function wireExerciseTypeFieldEvents(){
  const addBtn = document.querySelector('[data-action="add-mc-opt"]');
  if(addBtn){
    addBtn.onclick = ()=>{
      const wrap = document.getElementById('mc-options');
      const idx = wrap.children.length;
      const div = document.createElement('div');
      div.className='option-edit-row';
      div.innerHTML = '<input type="radio" name="mc-correct" value="'+idx+'"><input type="text" class="input" data-mc-opt placeholder="Opción '+(idx+1)+'"><button type="button" class="icon-btn danger" data-remove-opt>'+icon('close',14)+'</button>';
      wrap.appendChild(div);
      wireRemoveOptButtons();
    };
  }
  wireRemoveOptButtons();
  document.querySelectorAll('[data-tfcorrect]').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('[data-tfcorrect]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    };
  });
}
function wireRemoveOptButtons(){
  document.querySelectorAll('[data-remove-opt]').forEach(btn=>{
    btn.onclick = ()=>{
      const wrap = document.getElementById('mc-options');
      if(wrap.children.length>2) btn.closest('.option-edit-row').remove();
      else showToast('⚠️','Mínimo dos opciones','');
    };
  });
}

function showConfirm(message, confirmLabel, danger, cancelLabel){
  return new Promise(resolve=>{
    const html = '<div class="sheet-handle"></div>' +
      '<div class="body-text" style="padding:8px 4px 20px; text-align:center;">'+escapeHtml(message)+'</div>' +
      '<div class="btn-block-row">' +
        '<button class="btn btn-secondary" id="confirm-cancel-btn" style="flex:1;">'+escapeHtml(cancelLabel||'Cancelar')+'</button>' +
        '<button class="btn '+(danger?'btn-danger':'btn-primary')+'" id="confirm-ok-btn" style="flex:1;">'+escapeHtml(confirmLabel||'Confirmar')+'</button>' +
      '</div>';
    openModal(html);
    let settled = false;
    modalOnDismiss = ()=>{ if(settled) return; settled=true; resolve(false); };
    document.getElementById('confirm-cancel-btn').onclick = ()=>{ if(settled) return; settled=true; modalOnDismiss=null; closeModal(); resolve(false); };
    document.getElementById('confirm-ok-btn').onclick = ()=>{ if(settled) return; settled=true; modalOnDismiss=null; closeModal(); resolve(true); };
  });
}

/* ======================= EVENT WIRING ======================= */
function afterRender(){
  // vocab: toggle description translation (word/description shown vs. Spanish translation)
  document.querySelectorAll('[data-toggle-desc]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-toggle-desc');
      state.vocabTranslateShown[id] = !state.vocabTranslateShown[id];
      renderVocabOnly();
    };
  });
  // vocab search / filters
  const vsearch = document.getElementById('vocab-search');
  if(vsearch){
    vsearch.oninput = ()=>{
      const pos = vsearch.selectionStart;
      state.vocabSearch = vsearch.value;
      renderVocabOnly();
      const newInput = document.getElementById('vocab-search');
      if(newInput){ newInput.focus(); try{ newInput.setSelectionRange(pos,pos); }catch(e){} }
    };
  }
  document.querySelectorAll('[data-vcategory]').forEach(c=>{ c.onclick=()=>{ state.vocabFilterCategory = c.getAttribute('data-vcategory'); render(); }; });
  document.querySelectorAll('[data-ctopic]').forEach(c=>{ c.onclick=()=>{ state.contentFilterTopic = c.getAttribute('data-ctopic'); render(); }; });

  // study
  document.querySelectorAll('[data-study-topic]').forEach(r=>{ r.onclick=()=>{ state.studyTopicId = r.getAttribute('data-study-topic'); render(); }; });
  const back = document.querySelector('[data-action="study-back"]'); if(back) back.onclick=()=>{ state.studyTopicId=null; render(); };
  document.querySelectorAll('[data-practice-topic]').forEach(btn=>{ btn.onclick=()=>{ startPracticeSession(btn.getAttribute('data-practice-topic')); }; });
  const practiceGlobalBtn = document.querySelector('[data-action="practice-global"]'); if(practiceGlobalBtn) practiceGlobalBtn.onclick=()=>{ startPracticeSession('all'); };

  // exam setup
  document.querySelectorAll('[data-ecount]').forEach(chip=>{
    chip.onclick=()=>{ document.querySelectorAll('[data-ecount]').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); examConfig.count = chip.getAttribute('data-ecount')==='all' ? 'all' : Number(chip.getAttribute('data-ecount')); };
  });
  let examTopicSel = ['all'];
  document.querySelectorAll('[data-etopic]').forEach(chip=>{
    chip.onclick=()=>{
      const val = chip.getAttribute('data-etopic');
      if(val==='all'){
        document.querySelectorAll('[data-etopic]').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active'); examTopicSel=['all'];
      } else {
        document.querySelector('[data-etopic="all"]').classList.remove('active');
        chip.classList.toggle('active');
        examTopicSel = Array.from(document.querySelectorAll('[data-etopic].active')).map(c=>c.getAttribute('data-etopic'));
        if(examTopicSel.length===0){ document.querySelector('[data-etopic="all"]').classList.add('active'); examTopicSel=['all']; }
      }
    };
  });
  const startExamBtn = document.querySelector('[data-action="start-exam"]');
  if(startExamBtn) startExamBtn.onclick = ()=>{
    examConfig.topics = examTopicSel;
    startExam(examConfig);
  };

  // exercise runner interactions
  wireRunnerEvents();

  // content tabs
  document.querySelectorAll('[data-ctab]').forEach(b=>{ b.onclick=()=>{ state.contentTab = b.getAttribute('data-ctab'); state.contentFilterTopic='all'; render(); }; });

  // content CRUD
  const addTopicBtn = document.querySelector('[data-action="add-topic"]'); if(addTopicBtn) addTopicBtn.onclick=()=>openTopicModal(null);
  document.querySelectorAll('[data-edit-topic]').forEach(b=>{ b.onclick=()=>openTopicModal(b.getAttribute('data-edit-topic')); });
  document.querySelectorAll('[data-del-topic]').forEach(b=>{ b.onclick=()=>{ const id=b.getAttribute('data-del-topic'); showConfirm('¿Eliminar este tema y todos sus ejercicios y vocabulario asociados?','Eliminar',true).then(ok=>{ if(ok) deleteTopic(id); }); }; });

  const addExBtn = document.querySelector('[data-action="add-exercise"]'); if(addExBtn) addExBtn.onclick=()=>openExerciseModal(null);
  document.querySelectorAll('[data-edit-ex]').forEach(b=>{ b.onclick=()=>openExerciseModal(b.getAttribute('data-edit-ex')); });
  document.querySelectorAll('[data-del-ex]').forEach(b=>{ b.onclick=()=>{ const id=b.getAttribute('data-del-ex'); showConfirm('¿Eliminar este ejercicio?','Eliminar',true).then(ok=>{ if(ok) deleteExercise(id); }); }; });

  const addVocBtn = document.querySelector('[data-action="add-vocab"]'); if(addVocBtn) addVocBtn.onclick=()=>openVocabModal(null);
  document.querySelectorAll('[data-edit-voc]').forEach(b=>{ b.onclick=()=>openVocabModal(b.getAttribute('data-edit-voc')); });
  document.querySelectorAll('[data-del-voc]').forEach(b=>{ b.onclick=()=>{ const id=b.getAttribute('data-del-voc'); showConfirm('¿Eliminar esta palabra?','Eliminar',true).then(ok=>{ if(ok) deleteVocab(id); }); }; });

  const addAchBtn = document.querySelector('[data-action="add-achievement"]'); if(addAchBtn) addAchBtn.onclick=()=>openAchievementModal(null);
  document.querySelectorAll('[data-edit-ach]').forEach(b=>{ b.onclick=()=>openAchievementModal(b.getAttribute('data-edit-ach')); });
  document.querySelectorAll('[data-del-ach]').forEach(b=>{ b.onclick=()=>{ const id=b.getAttribute('data-del-ach'); showConfirm('¿Eliminar este logro?','Eliminar',true).then(ok=>{ if(ok) deleteAchievement(id); }); }; });

  // settings
  document.querySelectorAll('[data-theme-opt]').forEach(b=>{ b.onclick=()=>{ DATA.settings.theme=b.getAttribute('data-theme-opt'); save(); render(); }; });
  const dailyGoalInput = document.getElementById('daily-goal-input'); if(dailyGoalInput) dailyGoalInput.onchange=()=>{ DATA.settings.dailyGoal=Math.max(1,Number(dailyGoalInput.value)||15); save(); };
  const soundToggle = document.getElementById('sound-toggle'); if(soundToggle) soundToggle.onchange=()=>{ DATA.settings.soundEnabled=soundToggle.checked; save(); };
  const exportBtn = document.querySelector('[data-action="export-data"]'); if(exportBtn) exportBtn.onclick=exportData;
  const importFile = document.getElementById('import-file'); if(importFile) importFile.onchange=(e)=>importData(e.target.files[0]);
  const resetBtn = document.querySelector('[data-action="reset-all"]'); if(resetBtn) resetBtn.onclick=()=>{
    showConfirm('Esto borrará todos tus temas, ejercicios, vocabulario y progreso.', 'Continuar', true).then(ok=>{
      if(!ok) return;
      showConfirm('Esta acción no se puede deshacer. ¿Seguro?', 'Sí, borrar todo', true).then(ok2=>{
        if(!ok2) return;
        DATA = defaultData(); save(); render(); showToast('🗑️','Datos restablecidos','');
      });
    });
  };

  // exam result actions
  const examDone = document.querySelector('[data-action="exam-done"]'); if(examDone) examDone.onclick=()=>{ setScreen('home'); };
  const retryMissed = document.querySelector('[data-action="retry-missed"]'); if(retryMissed) retryMissed.onclick=()=>{
    const missedIds = state.examResult.details.filter(d=>!d.isCorrect).map(d=>d.ex.id);
    missedIds.forEach(id=>{ const p=DATA.progress[id]; if(p){ p.box=0; p.lastSeen=null; } });
    save();
    state.examResult=null;
    startPracticeSession('all');
  };

  // modal generic
  document.querySelectorAll('[data-nav]').forEach(b=>{ b.onclick=()=>setScreen(b.getAttribute('data-nav')); });
  document.querySelectorAll('[data-action="close-modal"]').forEach(b=>{ b.onclick=closeModal; });

  wireModalActions();
}

function renderVocabOnly(){
  document.getElementById('content').innerHTML = renderVocab();
  afterRender();
}

function wireModalActions(){
  const saveTopicBtn = document.querySelector('[data-action="save-topic"]');
  if(saveTopicBtn) saveTopicBtn.onclick=()=>{
    const name = document.getElementById('m-topic-name').value.trim();
    if(!name){ showToast('⚠️','Ponle un nombre al tema',''); return; }
    const notes = document.getElementById('m-topic-notes').value;
    const id = saveTopicBtn.getAttribute('data-id');
    if(id){ const t=topicById(id); t.name=name; t.grammarNotes=notes; }
    else { DATA.topics.push({id:uid(), name, grammarNotes:notes, createdAt:Date.now()}); }
    save(); closeModal(); render();
    showToast('✅', id?'Tema actualizado':'Tema creado','');
  };

  const saveExBtn = document.querySelector('[data-action="save-exercise"]');
  if(saveExBtn) saveExBtn.onclick=()=>{
    const topicId = document.getElementById('m-ex-topic').value;
    const type = document.getElementById('m-ex-type').value;
    const prompt = document.getElementById('m-ex-prompt').value.trim();
    if(!prompt){ showToast('⚠️','Escribe el enunciado',''); return; }
    const hint = document.getElementById('m-ex-hint').value.trim();
    const explanation = document.getElementById('m-ex-explanation').value.trim();
    let payload = {topicId, type, prompt, hint, explanation};
    if(type==='multiple_choice'){
      const optInputs = Array.from(document.querySelectorAll('[data-mc-opt]'));
      const options = optInputs.map(i=>i.value.trim());
      if(options.some(o=>!o) || options.length<2){ showToast('⚠️','Completa todas las opciones',''); return; }
      const checked = document.querySelector('input[name="mc-correct"]:checked');
      if(!checked){ showToast('⚠️','Marca la opción correcta',''); return; }
      payload.options = options; payload.correctIndex = Number(checked.value);
    } else if(type==='fill_blank' || type==='translation'){
      const accepted = document.getElementById('m-ex-accepted').value.split(',').map(s=>s.trim()).filter(Boolean);
      if(accepted.length===0){ showToast('⚠️','Añade al menos una respuesta correcta',''); return; }
      payload.acceptedAnswers = accepted;
    } else if(type==='true_false'){
      const activeBtn = document.querySelector('[data-tfcorrect].active');
      payload.correctBool = activeBtn ? activeBtn.getAttribute('data-tfcorrect')==='true' : true;
    }
    const id = saveExBtn.getAttribute('data-id');
    if(id){ Object.assign(exById(id), payload); }
    else { payload.id = uid(); payload.createdAt = Date.now(); DATA.exercises.push(payload); }
    save(); closeModal(); render();
    showToast('✅', id?'Ejercicio actualizado':'Ejercicio creado','');
  };

  const saveVocBtn = document.querySelector('[data-action="save-vocab"]');
  if(saveVocBtn) saveVocBtn.onclick=()=>{
    const term = document.getElementById('m-voc-term').value.trim();
    const translationEs = document.getElementById('m-voc-tr').value.trim();
    const category = document.getElementById('m-voc-category').value.trim();
    const description = document.getElementById('m-voc-def').value.trim();
    const descriptionEs = document.getElementById('m-voc-def-es').value.trim();
    if(!term || !translationEs || !description || !descriptionEs){ showToast('⚠️','Rellena término, traducción y descripción (inglés y español)',''); return; }
    if(!category){ showToast('⚠️','La categoría es obligatoria',''); return; }
    const phonetic = document.getElementById('m-voc-phonetic').value.trim();
    const example = document.getElementById('m-voc-ex').value.trim();
    const id = saveVocBtn.getAttribute('data-id');
    const payload = {term, translationEs, phonetic, category, description, descriptionEs, example};
    if(id){ const v=DATA.vocabulary.find(x=>x.id===id); Object.assign(v, payload); }
    else { DATA.vocabulary.push(Object.assign({id:uid(), createdAt:Date.now()}, payload)); }
    save(); closeModal(); render();
    showToast('✅', id?'Palabra actualizada':'Palabra añadida','');
  };

  const saveAchBtn = document.querySelector('[data-action="save-achievement"]');
  if(saveAchBtn) saveAchBtn.onclick=()=>{
    const name = document.getElementById('m-ach-name').value.trim();
    if(!name){ showToast('⚠️','Ponle un nombre al logro',''); return; }
    const iconVal = document.getElementById('m-ach-icon').value.trim() || '🏆';
    const desc = document.getElementById('m-ach-desc').value.trim();
    const type = document.getElementById('m-ach-type').value;
    const target = Number(document.getElementById('m-ach-target').value) || 1;
    const topicSel = document.getElementById('m-ach-topic');
    const topicId = topicSel ? topicSel.value : null;
    const id = saveAchBtn.getAttribute('data-id');
    if(id){ const a=DATA.achievements.find(x=>x.id===id); Object.assign(a, {name, description:desc, icon:iconVal, type, target, topicId: type==='topic_mastery'?topicId:undefined}); }
    else { DATA.achievements.push({id:uid(), name, description:desc, icon:iconVal, type, target, topicId: type==='topic_mastery'?topicId:undefined, custom:true}); }
    save(); closeModal(); render();
    showToast('✅', id?'Logro actualizado':'Logro creado','');
    checkAchievements();
  };
}

function deleteTopic(id){
  DATA.exercises = DATA.exercises.filter(e=>e.topicId!==id);
  DATA.achievements.forEach(a=>{ if(a.type==='topic_mastery' && a.topicId===id){ a.type='total_correct'; a.topicId=undefined; } });
  DATA.topics = DATA.topics.filter(t=>t.id!==id);
  save(); render();
}
function deleteExercise(id){ DATA.exercises = DATA.exercises.filter(e=>e.id!==id); delete DATA.progress[id]; save(); render(); }
function deleteVocab(id){ DATA.vocabulary = DATA.vocabulary.filter(v=>v.id!==id); save(); render(); }
function deleteAchievement(id){ DATA.achievements = DATA.achievements.filter(a=>a.id!==id); DATA.unlockedAchievementIds = DATA.unlockedAchievementIds.filter(x=>x!==id); save(); render(); }

/* ======================= PRACTICE / EXAM FLOW ======================= */
function startPractice(topicId){
  const pool = buildPracticePool(topicId);
  if(pool.length===0){ showToast('⚠️','No hay ejercicios en este tema',''); return; }
  const first = pickAdaptiveExercise(pool, null);
  state.practice = {pool, topicFilterId:topicId, current:first, answeredState:false, selected:null, textValue:'', lastCorrect:false, sessionCorrect:0, sessionTotal:0};
  render();
}
// Arranca una sesión de práctica desde cualquier pantalla (p.ej. Estudio), cambiando
// primero a la pantalla de Práctica para que startPractice() la renderice correctamente.
function startPracticeSession(topicId){
  state.screen = 'practice';
  startPractice(topicId);
  window.scrollTo(0,0);
}
function wireRunnerEvents(){
  if(state.screen==='practice' && state.practice){
    const ctx = state.practice; const ex = ctx.current;
    if(!ex) return;
    document.querySelectorAll('[data-opt]').forEach(btn=>{
      btn.onclick = ()=>{
        if(ctx.answeredState) return;
        const i = Number(btn.getAttribute('data-opt'));
        submitPracticeAnswer(i);
      };
    });
    document.querySelectorAll('[data-tf]').forEach(btn=>{
      btn.onclick = ()=>{
        if(ctx.answeredState) return;
        submitPracticeAnswer(btn.getAttribute('data-tf')==='true');
      };
    });
    const input = document.getElementById('free-answer-input');
    if(input){
      input.oninput = ()=>{ ctx.textValue = input.value; };
      input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); if(!ctx.answeredState) submitPracticeAnswer(input.value); } };
      setupKeyboardScroll(input);
    }
    const checkBtn = document.querySelector('[data-action="practice-check"]');
    if(checkBtn) checkBtn.onclick = ()=>submitPracticeAnswer(ctx.textValue);
    const nextBtn = document.querySelector('[data-action="practice-next"]');
    if(nextBtn) nextBtn.onclick = ()=>nextPracticeExercise();
    const stopBtn = document.querySelector('[data-action="practice-stop"]');
    if(stopBtn) stopBtn.onclick = ()=>{
      showConfirm('¿Seguro que quieres terminar?', 'Sí', true, 'No').then(ok=>{
        if(ok){ state.practice=null; setScreen('home'); }
      });
    };
    const hintBtn = document.querySelector('[data-action="show-hint"]');
    if(hintBtn) hintBtn.onclick = ()=> openHintModal(ex.hint);
  }
  if(state.screen==='exam' && state.exam){
    const ctx = state.exam; const ex = ctx.questions[ctx.index];
    if(!ex) return;
    document.querySelectorAll('[data-opt]').forEach(btn=>{
      btn.onclick = ()=>{ ctx.answers[ex.id] = Number(btn.getAttribute('data-opt')); render(); };
    });
    document.querySelectorAll('[data-tf]').forEach(btn=>{
      btn.onclick = ()=>{ ctx.answers[ex.id] = btn.getAttribute('data-tf')==='true'; render(); };
    });
    const input = document.getElementById('free-answer-input');
    if(input){
      input.oninput = ()=>{ ctx.answers[ex.id] = input.value; };
      setupKeyboardScroll(input);
    }
    const nextBtn = document.querySelector('[data-action="exam-next"]');
    if(nextBtn) nextBtn.onclick = ()=>{ ctx.index = Math.min(ctx.questions.length-1, ctx.index+1); render(); };
    const prevBtn = document.querySelector('[data-action="exam-prev"]');
    if(prevBtn) prevBtn.onclick = ()=>{ ctx.index = Math.max(0, ctx.index-1); render(); };
    const submitBtn = document.querySelector('[data-action="exam-submit"]');
    if(submitBtn) submitBtn.onclick = ()=>finishExam();
    const finishEarly = document.querySelector('[data-action="exam-finish-early"]');
    if(finishEarly) finishEarly.onclick = ()=>{ showConfirm('¿Terminar el examen ahora? Las preguntas no respondidas contarán como falladas.','Terminar',true).then(ok=>{ if(ok) finishExam(); }); };
  }
}
function submitPracticeAnswer(userInput){
  const ctx = state.practice; const ex = ctx.current;
  const isCorrect = checkAnswer(ex, ex.type==='multiple_choice'?userInput:(ex.type==='true_false'?userInput:userInput));
  ctx.answeredState = true; ctx.selected = userInput; ctx.lastCorrect = isCorrect;
  ctx.sessionTotal++; if(isCorrect) ctx.sessionCorrect++;
  recordAnswer(ex, isCorrect);
  beep(isCorrect?880:220, isCorrect?140:220);
  render();
}
function nextPracticeExercise(){
  const ctx = state.practice;
  const nextEx = pickAdaptiveExercise(ctx.pool, ctx.current.id);
  ctx.current = nextEx; ctx.answeredState=false; ctx.selected=null; ctx.textValue=''; ctx.lastCorrect=false;
  render();
}
function startExam(cfg){
  const questions = buildExamQuestions(cfg);
  if(questions.length===0){ showToast('⚠️','No hay ejercicios para esa selección',''); return; }
  state.exam = {questions, index:0, answers:{}, startTime:Date.now(), config:cfg};
  render();
}
function finishExam(){
  const ctx = state.exam;
  const details = ctx.questions.map(ex=>{
    const userAns = ctx.answers[ex.id];
    const isCorrect = userAns===undefined ? false : checkAnswer(ex, userAns);
    let userAnswerLabel = '(sin responder)';
    if(userAns!==undefined){
      if(ex.type==='multiple_choice') userAnswerLabel = ex.options[userAns];
      else if(ex.type==='true_false') userAnswerLabel = userAns ? 'Verdadero' : 'Falso';
      else userAnswerLabel = userAns;
    }
    recordAnswer(ex, isCorrect);
    return {ex, isCorrect, userAnswerLabel};
  });
  const byTopic = {};
  details.forEach(d=>{
    const tid = d.ex.topicId;
    if(!byTopic[tid]) byTopic[tid] = {correct:0, total:0};
    byTopic[tid].total++; if(d.isCorrect) byTopic[tid].correct++;
  });
  const correctCount = details.filter(d=>d.isCorrect).length;
  const percentage = Math.round(correctCount/details.length*100);
  const record = {id:uid(), date:Date.now(), score:correctCount, total:details.length, percentage, byTopic, durationSec:Math.round((Date.now()-ctx.startTime)/1000)};
  DATA.examHistory.push(record);
  if(DATA.examHistory.length>50) DATA.examHistory = DATA.examHistory.slice(-50);
  save();
  checkAchievements();
  state.examResult = {correctCount, total:details.length, percentage, byTopic, details};
  state.exam = null;
  render();
}

/* ======================= EXPORT / IMPORT ======================= */
let downloadsCap = null;
async function initDownloads(){
  try{
    if(window.claude && window.claude.use){
      downloadsCap = await window.claude.use('downloads');
    }
  }catch(e){ downloadsCap = null; }
}
async function exportData(){
  const json = JSON.stringify(DATA, null, 2);
  const filename = 'english-trainer-backup-'+todayStr()+'.json';
  if(downloadsCap){
    try{
      await downloadsCap.save({filename, data: json});
      showToast('⬇️','Descarga iniciada','');
      return;
    }catch(e){}
  }
  openModal(modalHeader('Copia de seguridad') + '<div class="footnote" style="margin-bottom:8px;">No se pudo iniciar la descarga automática. Copia este texto y guárdalo en un archivo .json:</div><textarea class="textarea" style="min-height:220px;" onclick="this.select()" readonly>'+escapeHtml(json)+'</textarea>');
}
function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      showConfirm('Esto reemplazará tus datos actuales por los del archivo importado.', 'Reemplazar', true).then(ok=>{
        if(!ok) return;
        DATA = normalizeData(parsed);
        save(); render();
        showToast('✅','Datos importados','');
      });
    }catch(e){ showToast('⚠️','Archivo no válido',''); }
  };
  reader.readAsText(file);
}

/* ======================= KEYBOARD HANDLING (mobile/tablet) ======================= */
let initialVVHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
function handleViewportResize(){
  if(!window.visualViewport) return;
  const vv = window.visualViewport;
  const diff = initialVVHeight - vv.height;
  const kbOpen = diff > 120;
  document.body.classList.toggle('keyboard-open', kbOpen);
  const tabbar = document.getElementById('tabbar');
  if(tabbar) tabbar.classList.toggle('hidden', kbOpen);
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', handleViewportResize);
  window.visualViewport.addEventListener('scroll', handleViewportResize);
}
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ initialVVHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight; }, 300); });
function setupKeyboardScroll(inputEl){
  inputEl.addEventListener('focus', ()=>{
    setTimeout(()=>{ inputEl.scrollIntoView({block:'center', behavior:'smooth'}); }, 280);
  });
}

/* ======================= SCROLL SHADOW ON TOPBAR ======================= */
window.addEventListener('scroll', function(){
  const tb = document.getElementById('topbar');
  if(tb) tb.classList.toggle('scrolled', window.scrollY > 4);
}, {passive:true});

/* ======================= INIT ======================= */
initDownloads();
render();

})();
</script>
